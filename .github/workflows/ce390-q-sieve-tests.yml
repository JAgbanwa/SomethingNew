name: CE390 regression tests

on:
  pull_request:
    paths:
      - '390 /Scripts for large-scale computations /**'
      - '.github/workflows/ce390-q-sieve-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: '390 /Scripts for large-scale computations /.'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve exact source for review
        run: |
          mkdir -p "$RUNNER_TEMP/ce390-evidence"
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ce390-evidence'
          (output / 'source-commit.txt').write_text(os.environ['GITHUB_SHA'] + '\n')
          with zipfile.ZipFile(output / 'source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and not any(p in {'bin', '__pycache__', '.git'} for p in path.relative_to(root).parts):
                      archive.write(path, 'ce390-integer-components/' + str(path.relative_to(root)))
          PY
      - name: Verify source integrity
        run: sha256sum --check SHA256SUMS | tee "$RUNNER_TEMP/ce390-evidence/integrity.txt"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libgmp-dev
      - name: Run the complete regression suite
        run: make -j2 && make test 2>&1 | tee "$RUNNER_TEMP/ce390-evidence/tests.txt"
      - name: Build and smoke-test the Docker runtime
        run: |
          docker build --progress=plain --tag ce390-xy-ci . 2>&1 | tee "$RUNNER_TEMP/ce390-evidence/docker-build.txt"
          docker run --rm --network none --entrypoint python3 ce390-xy-ci -c \
            'from q_sieve import reject_q; from xy_common import reject_xy_q; import cube_campaign; assert reject_q(7, require_integer_sqrt=True); assert not reject_q(7, require_integer_sqrt=False); assert reject_xy_q(7); assert not reject_xy_q(65)'
      - name: Preserve the historical broader rational nonempty regression
        run: |
          evidence="$RUNNER_TEMP/ce390-evidence"
          mkdir -p "$evidence/input" "$evidence/output"
          cp examples/xy-diagnostic/task-*.json "$evidence/input/task.json"
          docker run --rm --network none --cpus 1 --memory 512m --read-only \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$evidence/input,dst=/local/input,readonly" \
            --mount "type=bind,src=$evidence/output,dst=/local/output" \
            ce390-xy-ci python3 /app/run_xy_task.py --task /local/input/task.json --output-dir /local/output
          python3 collect_xy.py --page examples/xy-diagnostic/page-000000000000.json \
            --results-dir "$evidence/output" --output-dir "$evidence/collected"
          python3 verify_xy.py "$evidence/collected/hits.jsonl" --task "$evidence/input/task.json"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ce390-evidence'
          summary=json.loads((root/'collected/summary.json').read_text())
          assert summary['complete_selected_page'] and summary['unique_verified_solutions']==1
          row=json.loads((root/'collected/hits.jsonl').read_text())
          assert (row['n_num'],row['n_den'],row['x_num'],row['x_den'],row['y_num'],row['y_den'])==('-65','1','5785','6','3391','6')
          PY
      - name: Run both final integer-component pilots in the container
        run: |
          evidence="$RUNNER_TEMP/ce390-evidence/components"
          for b in 1 2; do
            mkdir -p "$evidence/input/b$b" "$evidence/results/b$b"
            cp examples/integer-components-pilot/b$b/task-*.json "$evidence/input/b$b/task.json"
            docker run --rm --network none --cpus 1 --memory 512m --read-only \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$evidence/input/b$b,dst=/local/input,readonly" \
              --mount "type=bind,src=$evidence/results/b$b,dst=/local/output" \
              ce390-xy-ci python3 /app/run_xy_task.py --task /local/input/task.json --output-dir /local/output \
              | tee "$evidence/console-b$b.txt"
            python3 verify_xy.py "$evidence/results/b$b/hits.jsonl" --task "$evidence/input/b$b/task.json" \
              | tee "$evidence/verified-b$b.json"
          done
          python3 collect_xy.py \
            --page examples/integer-components-pilot/b1/page-000000000000.json \
            --page examples/integer-components-pilot/b2/page-000000000000.json \
            --results-dir "$evidence/results" --output-dir "$evidence/collected"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ce390-evidence/components'
          observations=[]
          for b in (1,2):
              task=json.loads((root/f'input/b{b}/task.json').read_text())
              status=json.loads((root/f'results/b{b}/status.json').read_text())
              verified=json.loads((root/f'verified-b{b}.json').read_text())
              assert task['search']['require_integer_components'] is True
              assert task['search']['xy_denominator']==str(b)
              assert status['state']=='complete' and status['complete'] is True
              assert status['output_coverage']=={'start':'0','stop':'30000'}
              assert status['next_index']=='30000' and status['remaining_indices']=='0'
              assert verified['status']=='verified' and verified['integer_components_required'] is True
              observations.append({'xy_denominator':b,'elapsed_seconds':status['elapsed_seconds'],
                  'unique_hits':int(status['unique_hits_in_this_output']),
                  'counters':status['counters_this_invocation']})
          summary=json.loads((root/'collected/summary.json').read_text())
          assert summary['complete_selected_page'] and len(summary['tasks'])==2
          (root/'observations.json').write_text(json.dumps(observations,indent=2)+'\n')
          PY
      - name: Upload source and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ce390-integer-components-${{ github.sha }}
          path: ${{ runner.temp }}/ce390-evidence/
          retention-days: 30
